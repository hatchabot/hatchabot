# Moves one of the runtime image's aliases — :latest, :beta, :stable — to a
# release's image (release by workflow, issue #47, 2026-10-10). Nothing else
# moves them: a release build tags only :vX.Y.Z, and runtime-image.yml (a
# candidate) only its OpenClaw version.
#
#   - release.yml calls it for :latest after publishing the newest release;
#   - a push to main that changes channels.json (the publisher's fast lane,
#     asked for by scripts/promote.sh) moves :stable/:beta to the release the
#     channel now names; a channel moved to an older release by the fast
#     lane (its commit "Update channels") is a rollback (promote.sh asked
#     first, the publisher's gate held it to the tag's statement), so that
#     move may go backwards. Any other push moving one back fails, moving
#     nothing. A channel naming a tag with no published release fails too;
#     one with no manifest is skipped only from before v2.159.0;
#   - by hand (Actions → Promote images → Run workflow), one move.
#
# The `plan` job works out the moves; `move` makes them, one alias at a time
# (job concurrency `image-aliases-<alias>`). A release made before the
# release workflow has no manifest: its channel moves, its image tags do not.
# It runs only on hatchabot/hatchabot. The image is the one
# the release's own release-manifest.json names, by its index digest — the
# manifest is checked against its attestation from release.yml first — and
# the release's :vX.Y.Z must name that same digest. An alias never moves to an
# older release (the org.hatchabot.release label of the image it names now)
# unless allow_backwards. The job runs no project code: gh, jq and skopeo on
# the published manifest.
name: Promote images
on:
  push:
    branches: [main]
    paths: [channels.json]
  workflow_dispatch:
    inputs:
      version:
        description: The release (X.Y.Z) whose image the alias should name
        required: true
      alias:
        description: Which alias to move
        type: choice
        options: [latest, beta, stable]
        required: true
      allow_backwards:
        description: Allow moving the alias to an older release (a rollback)
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      alias:
        type: string
        required: true
      allow_backwards:
        type: boolean
        default: false
permissions: {}
jobs:
  plan:
    if: github.repository == 'hatchabot/hatchabot'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      moves: ${{ steps.plan.outputs.moves }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          VERSION: ${{ inputs.version }}
          ALIAS: ${{ inputs.alias }}
          BACK: ${{ inputs.allow_backwards }}
        run: |
          set -euo pipefail
          # Started by hand or called (release.yml's :latest): the one move asked for.
          if [ -n "$ALIAS" ]; then
            jq -cn --arg v "$VERSION" --arg a "$ALIAS" --arg b "$BACK" '[{version: $v, alias: $a, allow_backwards: ($b == "true")}]' \
              | sed 's/^/moves=/' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push that changed channels.json: each channel that moved.
          R="$GITHUB_REPOSITORY"
          chan() { gh api "repos/$R/contents/channels.json?ref=$1" -H 'Accept: application/vnd.github.raw' | jq -r --arg c "$2" '.[$c] // ""'; }
          MOVES='[]'
          for ch in stable beta; do
            OLD=""; echo "$BEFORE" | grep -qE '^0+$' || OLD="$(chan "$BEFORE" "$ch")"
            NEW="$(chan "$AFTER" "$ch")"
            [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] || continue
            # No release at all (release.yml failed, or is still running) is
            # a failure, not a release from before manifests (audit, 2026-10-20).
            ASSETS="$(gh release view "$NEW" --repo "$R" --json isDraft,assets -q 'if .isDraft then "DRAFT" else .assets[].name end')" \
              || { echo "::error::$ch → $NEW: $NEW has no release on $R"; exit 1; }
            [ "$ASSETS" != DRAFT ] || { echo "::error::$ch → $NEW: the release $NEW is still a draft"; exit 1; }
            if ! printf '%s\n' "$ASSETS" | grep -qx release-manifest.json; then
              # Every release from v2.159.0 on has one (release-manifest.sh's mf_required).
              V="${NEW#v}"; V="${V%%-*}"; MAJ="${V%%.*}"; V="${V#*.}"; MIN="${V%%.*}"
              if [ "$MAJ" -gt 2 ] || { [ "$MAJ" -eq 2 ] && [ "$MIN" -ge 159 ]; }; then
                echo "::error::$ch → $NEW: the release has no release-manifest.json, which every release from v2.159.0 on has"; exit 1
              fi
              echo "$ch → $NEW: released before release-manifest.json; the image :$ch is left as it is"; continue
            fi
            BACKWARDS=false
            # "~" sorts a pre-release below its release.
            if [ -n "$OLD" ] && [ "$(printf '%s\n%s\n' "${OLD#v}" "${NEW#v}" | sed 's/-/~/' | sort -V | tail -1 | sed 's/~/-/')" = "${OLD#v}" ]; then BACKWARDS=true; fi
            # A rollback comes only through the fast lane, whose gate holds it
            # to a statement in promote.sh's tag. A release commit carrying an
            # older channels.json (tagged before a promote) is a mistake: it
            # moved :stable back without a word (audit, 2026-10-20).
            if [ "$BACKWARDS" = true ] && [ "$(printf '%s\n' "$HEAD_MSG" | sed -n 1p)" != "Update channels" ]; then
              echo "::error::$ch: ${OLD} → $NEW goes back, and not by the fast lane (the commit is \"$(printf '%s\n' "$HEAD_MSG" | sed -n 1p)\"): the image :$ch is left as it is. Promote $ch forward again (scripts/promote.sh), or move it by hand (Run workflow, allow_backwards)."
              exit 1
            fi
            echo "$ch: ${OLD:-unset} → $NEW$([ "$BACKWARDS" = true ] && echo ' (a rollback)')"
            MOVES="$(jq -c --arg v "${NEW#v}" --arg a "$ch" --argjson b "$BACKWARDS" '. + [{version: $v, alias: $a, allow_backwards: $b}]' <<<"$MOVES")"
          done
          echo "moves=$MOVES" >> "$GITHUB_OUTPUT"

  move:
    needs: plan
    if: needs.plan.outputs.moves != '[]'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.moves) }}
    permissions:
      contents: read
      packages: write
      attestations: read
    concurrency:
      group: image-aliases-${{ matrix.alias }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: move the alias by the release manifest's digest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
          ALIAS: ${{ matrix.alias }}
          BACK: ${{ matrix.allow_backwards }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          VERSION="${VERSION#v}"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || fail "\"$VERSION\" is not a version"
          case "$ALIAS" in latest|beta|stable) ;; *) fail "alias must be latest, beta or stable" ;; esac
          TAG="v$VERSION"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runtime"
          AUTH="$HOME/.docker/config.json"
          D="$RUNNER_TEMP/m"; mkdir -p "$D"

          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = false ] \
            || fail "$TAG is not a published release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p release-manifest.json -D "$D" \
            || fail "$TAG has no release-manifest.json (released before release by workflow): its image is not moved by digest"
          M="$D/release-manifest.json"
          # Made on the publisher's tag push (refs/tags/vX.Y.Z), or before the
          # publish kit, by a run started on main.
          attested() { gh attestation verify "$M" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$1"; }
          attested "refs/tags/$TAG" || attested refs/heads/main \
            || fail "release-manifest.json of $TAG does not carry release.yml's attestation"
          jq -e --arg v "$VERSION" --arg t "$TAG" --arg i "$IMAGE" \
            '.schema == 1 and .version == $v and .tag == $t and .image.repository == $i and .image.tag == $t and (.image.index | test("^sha256:[0-9a-f]{64}$"))' \
            "$M" >/dev/null || fail "release-manifest.json of $TAG does not describe $IMAGE:$TAG"
          INDEX="$(jq -r .image.index "$M")"
          digest_of() { echo "sha256:$(skopeo inspect --raw --authfile "$AUTH" "docker://$1" | sha256sum | cut -d' ' -f1)"; }
          [ "$(digest_of "$IMAGE:$TAG")" = "$INDEX" ] || fail "$IMAGE:$TAG does not name the manifest's $INDEX"

          # What the alias names now, and the release that image was built for.
          if CUR_RAW="$(skopeo inspect --raw --authfile "$AUTH" "docker://$IMAGE:$ALIAS" 2>"$D/err")"; then
            CUR="sha256:$(printf '%s' "$CUR_RAW" | sha256sum | cut -d' ' -f1)"
          elif grep -qiE 'manifest unknown|not found' "$D/err"; then
            CUR=""
          else
            cat "$D/err" >&2; fail "could not read $IMAGE:$ALIAS"
          fi
          if [ "$CUR" = "$INDEX" ]; then echo "✓ $IMAGE:$ALIAS already names $TAG ($INDEX)"; exit 0; fi
          HAS=""
          if [ -n "$CUR" ]; then
            HAS="$(skopeo inspect --authfile "$AUTH" --override-os linux --override-arch amd64 "docker://$IMAGE:$ALIAS" | jq -r '.Labels["org.hatchabot.release"] // ""')"
          fi
          if [ -n "$HAS" ]; then
            [ "$HAS" != "$VERSION" ] || fail "$IMAGE:$ALIAS is labelled $VERSION but is not the manifest's image ($CUR, not $INDEX)"
            # "~" sorts a pre-release below its release.
            NEWER="$(printf '%s\n%s\n' "$HAS" "$VERSION" | sed 's/-/~/' | sort -V | tail -1 | sed 's/~/-/')"
            if [ "$NEWER" = "$HAS" ] && [ "$BACK" != true ]; then
              fail ":$ALIAS names $HAS, newer than $VERSION — moving it back needs allow_backwards (promote.sh passes it for a rollback)"
            fi
          else
            echo "note: :$ALIAS ${CUR:+names $CUR, }with no release label (made before release by workflow, or not there yet) — moving it"
          fi

          skopeo copy --all --preserve-digests --retry-times 3 --src-authfile "$AUTH" --dest-authfile "$AUTH" \
            "docker://$IMAGE@$INDEX" "docker://$IMAGE:$ALIAS"
          [ "$(digest_of "$IMAGE:$ALIAS")" = "$INDEX" ] || fail "$IMAGE:$ALIAS does not name $INDEX after the move"
          echo "✓ $IMAGE:$ALIAS → $TAG ($INDEX)${HAS:+, was $HAS}"
