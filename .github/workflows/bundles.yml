name: Release bundles

# The prebuilt bundles the installer downloads (docs/install-bundle.md): one per
# platform, attached to the release. Built on an OLD Ubuntu so the compiled
# database driver loads on any glibc from 2.35 up (Debian 12, Ubuntu 22.04+);
# anything older falls back to the native install.
#
# Two jobs (#46, 2026-10-09): `bundle` installs dependencies and builds with a
# read-only token and no credentials left in git; `attach` holds the only write
# permission, runs no project code, checks each bundle against its .sha256 and
# uploads it exactly as before. Actions are pinned to commits
# (test/workflowPins.test.ts; docs/releasing.md, "Updating pinned actions and images").
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build bundles for (e.g. v2.132.0)'
        required: true

permissions: {}

jobs:
  bundle:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # A release bundle is built from the registry, never from a cache.
          package-manager-cache: false
      - name: build
        run: scripts/build-bundle.sh "$TAG" "${{ matrix.platform }}" dist-bundles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: dist-bundles/*
          if-no-files-found: error
          retention-days: 1
          # Already gzipped.
          compression-level: 0

  # Each platform's bundle is attached when its build passed, as when every
  # build attached its own: one failed platform does not hold back the others.
  attach:
    needs: bundle
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist-bundles
          merge-multiple: true
      - name: check each bundle against its .sha256
        working-directory: dist-bundles
        run: |
          ls -1 *.sha256 >/dev/null
          for f in *.sha256; do sha256sum -c "$f"; done
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist-bundles/* --clobber --repo "$GITHUB_REPOSITORY"
