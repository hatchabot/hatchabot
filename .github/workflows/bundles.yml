name: Release bundles

# The prebuilt bundles the installer downloads (docs/install-bundle.md): one per
# platform. Built on an OLD Ubuntu so the compiled database driver loads on any
# glibc from 2.35 up (Debian 12, Ubuntu 22.04+); anything older falls back to
# the native install.
#
# Build only: each platform's bundle and its .sha256 become an artifact
# (`bundle-<platform>`), with a read-only token and no credentials left in git
# (#46, 2026-10-09). release.yml calls this, then puts the artifacts in the
# release manifest, attests them and uploads them to a draft before it
# publishes; nothing here writes to a release any more (release by workflow,
# #38, 2026-10-10). Started by hand, it builds bundles of any commit to try
# (named for the version given). Actions are pinned to commits
# (test/workflowPins.test.ts; docs/releasing.md, "Updating pinned actions and images").
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to build (a full sha)
        type: string
        required: true
      version:
        description: The version the bundles are named for (X.Y.Z)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      commit:
        description: The commit or branch to build (artifacts only; nothing is published)
        required: true
      version:
        description: The version the bundles are named for (X.Y.Z)
        required: true

permissions: {}

jobs:
  bundle:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      COMMIT: ${{ inputs.commit }}
      VERSION: ${{ inputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # A release bundle is built from the registry, never from a cache.
          package-manager-cache: false
      - name: build
        run: |
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "\"$VERSION\" is not X.Y.Z" >&2; exit 1; }
          HEAD_SHA="$(git rev-parse HEAD)"
          if echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then [ "$HEAD_SHA" = "$COMMIT" ] || { echo "checked out $HEAD_SHA, not $COMMIT" >&2; exit 1; }; fi
          # The tag does not exist yet: build the checked-out commit under its name.
          HATCHABOT_BUNDLE_REF="$HEAD_SHA" scripts/build-bundle.sh "v$VERSION" "$PLATFORM" dist-bundles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: dist-bundles/*
          if-no-files-found: error
          retention-days: 1
          # Already gzipped.
          compression-level: 0
