name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and every action and image pinned to a digest (#46, 2026-10-09):
# test/workflowPins.test.ts fails the test job when one is not. How to bump a
# pin: docs/releasing.md, "Updating pinned actions and images".
permissions:
  contents: read

# Where it runs: on hatchabot/hatchabot, GitHub's hosted runners. In the
# private dev repo, its own runners (label hatchabot-dev, on the
# maintainer's machine as a user with no docker and no access to the live
# install), except `ui` (docker), which runs hosted and only for pull
# requests; `privacy` runs on the public repo only (docs/releasing.md).
jobs:
  test:
    runs-on: ${{ github.repository == 'hatchabot/hatchabot' && 'ubuntu-latest' || 'hatchabot-dev' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm test` also syntax-checks the single-file web app.
      - run: npm test
      - name: release consistency (lock version, scripts parse)
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(l.version!==p.version||l.packages[""].version!==p.version){console.error(`package-lock.json says ${l.version}, package.json says ${p.version}`);process.exit(1)}'
          for f in install.sh scripts/*.sh; do bash -n "$f"; done
      # Whole provision/rollback loop in-process against the mock provider —
      # sub-second, no docker, no network, no secrets.
      - run: npm run e2e

  # The real web page, clicked through in headless Chrome against a stubbed
  # API (scripts/ui-clickthrough.mjs). It is one of the required gates
  # (AGENTS.md); CI ran every other gate but this one (#14). Chrome comes from
  # its Docker image, which GitHub's Ubuntu runners can run. promote.sh reads
  # this workflow's result, so a failure here also stops a promote.
  ui:
    # Headless Chrome in a container: docker on GitHub's runners, rootless
    # podman on the dev repo's own (the publish kit's runner/containers.sh
    # sets it up; they have no docker), so it spends no Actions minutes.
    runs-on: ${{ github.repository == 'hatchabot/hatchabot' && 'ubuntu-latest' || 'hatchabot-dev' }}
    timeout-minutes: 15
    env:
      CONTAINER_CLI: ${{ github.repository == 'hatchabot/hatchabot' && 'docker' || 'podman' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The same digest as CHROME_IMAGE in scripts/ui-clickthrough.mjs (the pin test checks).
      - run: $CONTAINER_CLI pull docker.io/zenika/alpine-chrome@sha256:eb3378c1ed0079f94db054a5fe1aaa790a254ec0d6bbc67eda052420d86a179d # latest
      - run: npm run test:ui

  # Can a database written by an OLDER release be opened by this one?
  #
  # Every unit test starts from a fresh :memory: database, where CREATE TABLE
  # runs in full — so a column added to an existing table with no ALTER passes
  # the whole suite and then throws on every real install. v2.14.0 shipped that
  # and took the Telegram approve flow down. This builds a database with the old
  # tag's own code and opens it with this one.
  # gitleaks on the commits a push or pull request adds: generic secrets in
  # anyone's change, pull requests included, which never pass the maintainer's
  # own hooks (docs/releasing.md, "The privacy check"); then the whole tree
  # with gitleaks' default rules and no config, as the publisher's gate scans
  # a release (it ignores .gitleaks.toml, which allows nothing either), so a
  # hit shows here before a tag rather than blocking the release.
  secrets:
    runs-on: ${{ github.repository == 'hatchabot/hatchabot' && 'ubuntu-latest' || 'hatchabot-dev' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks on the new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          V=8.30.1
          case "$(uname -m)" in
            x86_64) A=x64; SUM=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64) A=arm64; SUM=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "::error::no gitleaks pin for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_${A}.tar.gz"
          echo "$SUM  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          FROM="${BASE:-$BEFORE}"
          if [ -n "$FROM" ] && ! echo "$FROM" | grep -qE '^0+$' && git cat-file -e "$FROM^{commit}" 2>/dev/null; then RANGE="$FROM..$HEAD_SHA"; else RANGE="-1 $HEAD_SHA"; FROM=""; fi
          # The config and its regression check come from the base commit, so
          # a change cannot loosen what it is judged by: a change to them
          # applies from the next one. A base without them uses this change's.
          CONFIG="$RUNNER_TEMP/gitleaks.toml"; REGRESSION="$RUNNER_TEMP/gitleaks-regression.sh"
          if [ -n "$FROM" ] && git show "$FROM:.gitleaks.toml" > "$CONFIG" 2>/dev/null && git show "$FROM:scripts/gitleaks-regression.sh" > "$REGRESSION" 2>/dev/null; then
            echo "gitleaks config and regression check: from $FROM"
          else
            cp .gitleaks.toml "$CONFIG"; cp scripts/gitleaks-regression.sh "$REGRESSION"
            echo "gitleaks config and regression check: from this change (no base, or the base has none)"
          fi
          ./gitleaks git --log-opts="$RANGE" --config "$CONFIG" --redact --no-banner --exit-code 1
          # The config still reports ordinary values whatever they are called,
          # and keeps its fixtures quiet only where they live (#42, 2026-10-09).
          bash "$REGRESSION" ./gitleaks "$CONFIG"
          # The tree as the publisher's gate sees it: plain files in a folder
          # with no gitleaks config or ignore list, default rules.
          mkdir -p "$RUNNER_TEMP/scan/tree"
          git archive "$HEAD_SHA" | tar -x -C "$RUNNER_TEMP/scan/tree"
          GL="$PWD/gitleaks"
          (cd "$RUNNER_TEMP/scan" && "$GL" dir . --redact --no-banner --exit-code 1)

  # The household privacy check, on GitHub (2026-10-10): what a pull request
  # or push to main adds — lines, file names, commit messages and authors, the
  # pull request's title, body and branch — looked up against keyed
  # fingerprints of the owner's private values (PRIVACY_FINGERPRINTS, synced
  # daily from the owner's machine; the values themselves never leave it).
  # Text written on another machine or on GitHub never passes the owner's
  # pre-push hook; this catches it. No secret (a fork's pull request) is a
  # failure, not a pass. The scanner comes from the base commit when it has
  # one, so a change cannot loosen the check it is judged by.
  privacy:
    # The public repo only: the private dev repo holds no fingerprint set;
    # what is published is gated by the publisher with it (docs/releasing.md).
    if: github.repository == 'hatchabot/hatchabot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0     # the whole range, and who authored main's commits
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: household privacy check (keyed fingerprints)
        env:
          PRIVACY_FINGERPRINTS: ${{ secrets.PRIVACY_FINGERPRINTS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          SCANNER="$RUNNER_TEMP/privacy-ci.mjs"
          if [ -n "$BASE" ] && git show "$BASE:scripts/privacy-ci.mjs" > "$SCANNER" 2>/dev/null; then echo "scanner: from $BASE"; else cp scripts/privacy-ci.mjs "$SCANNER"; echo "scanner: from this change (the base has none)"; fi
          node "$SCANNER" --dir "$GITHUB_WORKSPACE"

  upgrade:
    runs-on: ${{ github.repository == 'hatchabot/hatchabot' && 'ubuntu-latest' || 'hatchabot-dev' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0     # the script needs the tags, and their source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/upgrade-check.sh
      # The installer reads channels.json from main: a channel naming a tag
      # that does not exist would send every new install to "no release".
      - name: channels.json names real releases
        run: |
          for t in $(grep -oE '"v[^"]+"' channels.json | tr -d '"'); do
            git rev-parse -q --verify "refs/tags/$t" >/dev/null || { echo "channels.json names $t, which is not a tag"; exit 1; }
          done
