name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm test` also syntax-checks the single-file web app.
      - run: npm test
      - name: release consistency (lock version, scripts parse)
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(l.version!==p.version||l.packages[""].version!==p.version){console.error(`package-lock.json says ${l.version}, package.json says ${p.version}`);process.exit(1)}'
          for f in install.sh scripts/*.sh; do bash -n "$f"; done
      # Whole provision/rollback loop in-process against the mock provider —
      # sub-second, no docker, no network, no secrets.
      - run: npm run e2e

  # The real web page, clicked through in headless Chrome against a stubbed
  # API (scripts/ui-clickthrough.mjs). It is one of the required gates
  # (AGENTS.md); CI ran every other gate but this one (#14). Chrome comes from
  # its Docker image, which GitHub's Ubuntu runners can run. promote.sh reads
  # this workflow's result, so a failure here also stops a promote.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker pull zenika/alpine-chrome
      - run: npm run test:ui

  # Can a database written by an OLDER release be opened by this one?
  #
  # Every unit test starts from a fresh :memory: database, where CREATE TABLE
  # runs in full — so a column added to an existing table with no ALTER passes
  # the whole suite and then throws on every real install. v2.14.0 shipped that
  # and took the Telegram approve flow down. This builds a database with the old
  # tag's own code and opens it with this one.
  # gitleaks on the commits a push or pull request adds: generic secrets in
  # anyone's change, pull requests included, which never pass the maintainer's
  # own hooks (docs/releasing.md, "The privacy check"). .gitleaks.toml lets
  # through test fixtures whose values say they are made up.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks on the new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          V=8.28.0
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          FROM="${BASE:-$BEFORE}"
          if [ -n "$FROM" ] && ! echo "$FROM" | grep -qE '^0+$' && git cat-file -e "$FROM^{commit}" 2>/dev/null; then RANGE="$FROM..$HEAD_SHA"; else RANGE="-1 $HEAD_SHA"; fi
          ./gitleaks git --log-opts="$RANGE" --config .gitleaks.toml --redact --no-banner --exit-code 1
          # The config still reports ordinary values whatever they are called,
          # and keeps its fixtures quiet only where they live (#42, 2026-10-09).
          bash scripts/gitleaks-regression.sh ./gitleaks

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the script needs the tags, and their source
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/upgrade-check.sh
      # The installer reads channels.json from main: a channel naming a tag
      # that does not exist would send every new install to "no release".
      - name: channels.json names real releases
        run: |
          for t in $(grep -oE '"v[^"]+"' channels.json | tr -d '"'); do
            git rev-parse -q --verify "refs/tags/$t" >/dev/null || { echo "channels.json names $t, which is not a tag"; exit 1; }
          done
