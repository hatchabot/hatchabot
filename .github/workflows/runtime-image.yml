# A candidate runtime image for another OpenClaw version, built on GitHub's own
# arm64 and amd64 runners and published as ONE multi-arch tag,
# ghcr.io/<owner>/runtime:<openclaw version>, so a machine can try it in a
# minute instead of building it for twenty (docs/releasing.md, "Trying a newer
# OpenClaw"). Started by hand only.
#
# A release's image is not made here any more: release.yml builds it, pushes it
# by digest as :vX.Y.Z and records the digest in the release manifest; the
# :latest, :beta and :stable aliases move only through promote-images.yml
# (release by workflow, #47, 2026-10-10). This never moves an alias.
#
# The build (runtime-image-build.yml) is read-only and pushes nothing;
# `publish` holds the only packages: write, runs no project code, and pushes
# the archives and the index the build made, by digest (skopeo
# --preserve-digests: the registry refuses a manifest that does not match).
name: runtime image
on:
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: OpenClaw version to build (blank = the Dockerfile's pinned default)
        required: false
permissions: {}
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/runtime
jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/runtime-image-build.yml
    with:
      commit: ${{ github.sha }}
      release: ''
      openclaw_version: ${{ inputs.openclaw_version }}

  publish:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/image
          pattern: image-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One OCI layout holding both arches and the index the build made; skopeo
      # (on GitHub's Ubuntu runners) pushes it by the index digest, then names it.
      - name: push by digest, then tag the OpenClaw version
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          INDEX="$(jq -r .index /tmp/image/runtime-image.json)"
          V="$(jq -r .openclaw /tmp/image/runtime-image.json)"
          echo "$INDEX" | grep -qE '^sha256:[0-9a-f]{64}$' || { echo "no index digest" >&2; exit 1; }
          echo "$V" | grep -qE '^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "no OpenClaw version" >&2; exit 1; }
          [ "sha256:$(sha256sum /tmp/image/runtime-index.json | cut -d' ' -f1)" = "$INDEX" ] || { echo "runtime-index.json is not $INDEX" >&2; exit 1; }
          L=/tmp/layout; mkdir -p "$L"
          for a in amd64 arm64; do tar -xf "/tmp/image/runtime-$a.tar" -C "$L"; rm -f "/tmp/image/runtime-$a.tar"; done
          # buildkit writes the archive's files read-only: writable, then the top two replaced.
          chmod -R u+w "$L"; rm -f "$L/oci-layout" "$L/index.json"
          cp /tmp/image/runtime-index.json "$L/blobs/sha256/${INDEX#sha256:}"
          printf '{"imageLayoutVersion":"1.0.0"}' > "$L/oci-layout"
          printf '{"schemaVersion":2,"manifests":[{"mediaType":"application/vnd.oci.image.index.v1+json","digest":"%s","size":%s,"annotations":{"org.opencontainers.image.ref.name":"image"}}]}' \
            "$INDEX" "$(stat -c %s /tmp/image/runtime-index.json)" > "$L/index.json"
          AUTH="$HOME/.docker/config.json"
          skopeo copy --all --preserve-digests --retry-times 3 --dest-authfile "$AUTH" "oci:$L:image" "docker://$IMAGE@$INDEX"
          skopeo copy --all --preserve-digests --retry-times 3 --src-authfile "$AUTH" --dest-authfile "$AUTH" "docker://$IMAGE@$INDEX" "docker://$IMAGE:$V"
          GOT="sha256:$(skopeo inspect --raw --authfile "$AUTH" "docker://$IMAGE:$V" | sha256sum | cut -d' ' -f1)"
          [ "$GOT" = "$INDEX" ] || { echo "$IMAGE:$V names $GOT, not $INDEX" >&2; exit 1; }
          echo "✓ $IMAGE:$V = $INDEX (candidate; no alias moved)"
