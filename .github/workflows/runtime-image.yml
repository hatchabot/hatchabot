# Builds the agent runtime image on GitHub's own arm64 and amd64 runners and
# publishes ONE multi-arch tag to GHCR, so an install pulls it in a minute
# instead of building it for twenty. Runs on every release tag; can also be
# dispatched for a candidate OpenClaw version (published, never :latest).
name: runtime image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: OpenClaw version to build (blank = the Dockerfile's pinned default)
        required: false
      promote_latest:
        description: Also move :latest to this build
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/runtime
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          V="${{ github.event.inputs.openclaw_version }}"
          [ -n "$V" ] || V="$(grep -oP 'ARG OPENCLAW_VERSION=\K\S+' docker/Dockerfile.runtime)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # 2026.8+ has no engine to bake: those images are built engine-free (step 4 of the embedder design).
          echo "engine=$(node scripts/runtime-pins.mjs embed-engine "$V")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            OPENCLAW_VERSION=${{ steps.ver.outputs.version }}
            EMBED_ENGINE=${{ steps.ver.outputs.engine }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          V="${{ needs.build.outputs.version }}"
          TAGS=(-t "$IMAGE:$V")
          # A release tag is the proven fleet image: it also carries the release name and :latest.
          if [ "${{ github.ref_type }}" = tag ]; then TAGS+=(-t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest"); fi
          if [ "${{ github.event.inputs.promote_latest }}" = true ]; then TAGS+=(-t "$IMAGE:latest"); fi
          DIGESTS=$(for f in /tmp/digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          docker buildx imagetools create "${TAGS[@]}" $DIGESTS
          docker buildx imagetools inspect "$IMAGE:$V" | head -20
