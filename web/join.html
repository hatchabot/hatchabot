<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/app/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join an agent — Hatchabot</title>
<link rel="icon" href="/icons/icon-192.png?v=2">
<style>
  /* The app's two themes (web/index.html), the tokens this page uses. */
  :root, :root[data-theme="dark"] {
    --bg: #14161a; --panel: #1e2127; --panel-2: #262a31; --line: #32363e;
    --text: #e8e6e1; --dim: #9a978f; --accent: #e8a33d; --accent-ink: #14161a;
    --bad: #e06c5f; color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #ffffff; --panel-2: #f1f3f5; --line: #e2e5ea;
    --text: #1a1c20; --dim: #6b7079; --accent: #e8a33d; --accent-ink: #14161a;
    --bad: #cc4b3e; color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 48px 20px; }
  /* The app's wordmark: the egg and "Hatcha<b>bot</b>" in the one gold. */
  h1 { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 650; letter-spacing: .2px; margin: 0 0 6px; }
  h1 img { border-radius: 8px; display: block; }
  h1 b { color: var(--accent); font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 14px; padding: 20px; margin-top: 18px; }
  .agent { font-size: 22px; font-weight: 700; margin: 4px 0 12px; }
  .notice { background: var(--panel-2); border-radius: 10px; padding: 12px 14px;
            font-size: 14px; color: var(--dim); margin: 14px 0; }
  .notice b { color: var(--text); }
  label { display: block; font-size: 13px; color: var(--dim); margin: 14px 0 5px; }
  input { width: 100%; font: inherit; background: var(--bg); color: var(--text);
          border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; }
  button, .btn { font: inherit; font-weight: 650; cursor: pointer; width: 100%;
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 13px; border-radius: 10px; margin-top: 16px; text-align: center;
    text-decoration: none; display: block; }
  .btn.alt { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .hint { color: var(--dim); font-size: 13px; text-align: center; margin-top: 8px; }
  .hint a { color: inherit; }
  .steps { font-size: 14.5px; color: var(--dim); padding-left: 18px; }
  .steps li { margin: 6px 0; }
  .ways { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .way { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; margin: 0; }
  .way input { width: auto; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="/icons/icon-192.png?v=2" alt="" width="30" height="30"><span>Hatcha<b>bot</b></span></h1>
  <div class="card" id="card"><div style="color:var(--dim)">Checking your invite…</div></div>
</div>
<script src="/app/join.js"></script>
</body>
</html>
