# gitleaks (the CI "secrets" job): its default rules, and no allowlist.
#
# The publisher's gate scans every published file with gitleaks' default rules
# and ignores this file (publish kit, audit KIT-002), so a value allowed here
# would pass CI and then block the release (v2.164.0, 2026-10-17). A sample
# value a test or page needs is built at run time instead
# (test/support/fixtures.ts). An allowlist once hid real-looking values whose
# setting name said "example" or "fake" (audit issue #42, 2026-10-09);
# scripts/gitleaks-regression.sh checks that ordinary values, and the old
# samples, are still reported.
[extend]
useDefault = true
